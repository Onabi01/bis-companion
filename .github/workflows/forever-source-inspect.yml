name: Check Forever gear page extraction
on:
  push:
    branches: [feature/forever-preraid-bis-2.5.0]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Examine item cards
        run: |
          python3 - <<'PY'
          import urllib.request,re
          for slug in ["fury-warrior","retribution-paladin","feral-tank-druid"]:
              url="https://wowtbc.gg/warcraftforever/bis-list/"+slug+"/"
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=15) as r:data=r.read().decode("utf-8","replace")
              print("PAGE",slug)
              for slot in ["head","neck","finger1"]:
                  m=re.search(r'<div class="bis__card" id="'+slot+r'">',data)
                  if m:print("SLOT",slot,repr(data[m.start():m.start()+2200]))
              print("CSSCLASSES",sorted(set(re.findall(r'class="(item__[^"]+)"',data)))[:45])
          PY
