name: Check Forever gear page extraction
on:
  push:
    branches: [feature/forever-preraid-bis-2.5.0]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch one public reference
        run: |
          python3 - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          url="https://wowtbc.gg/warcraftforever/bis-list/fury-warrior/"
          try:
              request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; data audit)"})
              with urllib.request.urlopen(request, timeout=15) as r:
                  data=r.read().decode("utf-8", "replace")
                  print("HTTP",r.status,"BYTES",len(data))
                  for term in ["Lionheart Helm","item=12640","wowhead","__NEXT_DATA__"]:
                      idx=data.find(term)
                      print(term,idx,repr(data[max(0,idx-160):idx+300]) if idx!=-1 else "")
          except Exception as exc:
              print("FETCH ERROR",repr(exc))
          PY
