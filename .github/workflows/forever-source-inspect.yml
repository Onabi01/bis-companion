name: Build auditable Forever gear snapshot
on:
  push:
    branches: [feature/forever-preraid-bis-2.5.0]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch WoW Forever pre-raid recommendations
        run: |
          python3 tools/scrape_forever_bis.py --out /tmp/forever_preraid_snapshot.json
      - name: Export verified gear snapshot via job logs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/forever_preraid_snapshot.json').read_text(encoding='utf-8'))
          summary={k:(len(items),sum(i['id'] is not None for i in items)) for k,items in v['builds'].items()}
          print('SUMMARY',json.dumps(summary,separators=(',',':')))
          print('UNMATCHED',json.dumps(v['unmatched']))
          print('AMBIGUOUS',json.dumps(v['ambiguous']))
          s=json.dumps(v,ensure_ascii=True,separators=(',',':'))
          print('CHUNKS', (len(s)+7999)//8000, 'CHARS',len(s))
          for i in range(0,len(s),8000):
              print('BISCHUNK|%04d|%s'%(i//8000,s[i:i+8000]))
          PY
